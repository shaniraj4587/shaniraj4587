<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shani-stat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>

    <!-- Radial Atmospheric Wine Glows -->
    <radialGradient id="shani-stat-glow-right" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#451126" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shani-stat-glow-left" cx="20%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#190B12" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>

    <!-- Static Title Gradient -->
    <linearGradient id="shani-stat-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F0F3"/>
      <stop offset="60%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#C77B9B"/>
    </linearGradient>

    <!-- Glowing Underline Gradient -->
    <linearGradient id="shani-stat-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.1"/>
      <stop offset="25%" stop-color="#C77B9B" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#E5B5C7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>

    <!-- Flowing Wave Gradient -->
    <linearGradient id="shani-stat-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#701A3D" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#C77B9B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E5B5C7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Fine Technical Grid -->
    <pattern id="shani-stat-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#451126" stroke-width="0.75" stroke-opacity="0.28"/>
      <circle cx="28" cy="0" r="0.8" fill="#701A3D" fill-opacity="0.5"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="shani-stat-filter-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, Monaco, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Card Background -->
  <rect width="880" height="280" rx="16" fill="url(#shani-stat-bg)"/>
  <rect width="880" height="280" rx="16" fill="url(#shani-stat-glow-right)"/>
  <rect width="880" height="280" rx="16" fill="url(#shani-stat-glow-left)"/>
  <rect width="880" height="280" rx="16" fill="url(#shani-stat-grid)"/>

  <!-- Outer Borders -->
  <rect x="1" y="1" width="878" height="278" rx="15" fill="none" stroke="#451126" stroke-width="1.2" stroke-opacity="0.75"/>
  <rect x="5" y="5" width="870" height="270" rx="12" fill="none" stroke="#701A3D" stroke-width="0.6" stroke-opacity="0.3"/>

  <!-- Top Technical Status Bar -->
  <g transform="translate(48, 38)">
    <circle cx="0" cy="0" r="3.5" fill="#C77B9B"/>
    <text x="16" y="3.5" fill="#C77B9B" class="font-mono" font-size="10.5" letter-spacing="2" font-weight="600">SYSTEM.STATUS: ACTIVE // DATA &amp; BACKEND ARCHITECTURE</text>
  </g>

  <!-- Top-Right Engineering Tag -->
  <g transform="translate(832, 38)" text-anchor="end">
    <text x="0" y="3.5" fill="#701A3D" class="font-mono" font-size="10" letter-spacing="1.5">NODE: SHANI-RAJ.NET</text>
  </g>

  <!-- Left Main Content Group -->
  <g transform="translate(48, 86)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#190B12" stroke="#701A3D" stroke-width="0.8"/>
    <text x="110" y="15.5" fill="#E5B5C7" class="font-mono" font-size="10" font-weight="600" letter-spacing="1.8" text-anchor="middle">BCA (DATA SCIENCE) '26</text>

    <text x="0" y="68" fill="url(#shani-stat-title-grad)" class="font-sans" font-size="44" font-weight="800" letter-spacing="1.5">SHANI RAJ</text>

    <!-- Glowing Underline -->
    <g transform="translate(0, 82)">
      <line x1="0" y1="0" x2="380" y2="0" stroke="url(#shani-stat-line-grad)" stroke-width="2.5" filter="url(#shani-stat-filter-subtle)"/>
      <circle cx="160" cy="0" r="2.5" fill="#F8F0F3"/>
    </g>

    <text x="0" y="112" fill="#F8F0F3" class="font-sans" font-size="16.5" font-weight="500" letter-spacing="0.4">
      Data Analyst <tspan fill="#C77B9B">&amp;</tspan> Backend Systems Developer
    </text>

    <g transform="translate(0, 138)">
      <text x="0" y="0" fill="#E5B5C7" class="font-mono" font-size="11" letter-spacing="1.2">
        <tspan fill="#C77B9B">CORE:</tspan> Python <tspan fill="#701A3D">•</tspan> SQL <tspan fill="#701A3D">•</tspan> Django <tspan fill="#701A3D">•</tspan> Power BI <tspan fill="#701A3D">•</tspan> Pandas <tspan fill="#701A3D">•</tspan> MySQL
      </text>
    </g>
  </g>

  <!-- Sine Wave -->
  <path d="M 380 226 C 450 180, 520 250, 600 205 C 680 160, 750 220, 840 180" 
        fill="none" stroke="url(#shani-stat-wave-grad)" stroke-width="1.8" stroke-dasharray="8,6" opacity="0.75"/>

  <!-- Orbital Geometry -->
  <g transform="translate(710, 142)">
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#451126" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.5"/>
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#451126" stroke-width="0.8" stroke-dasharray="3,4" opacity="0.5"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#451126" stroke-width="1" opacity="0.65"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#C77B9B" stroke-width="1.2" stroke-dasharray="14 42" opacity="0.6"/>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#701A3D" stroke-width="1.2" stroke-dasharray="6 14" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="42" ry="24" fill="none" stroke="#C77B9B" stroke-width="1" stroke-dasharray="3 5" opacity="0.7"/>
    <circle cx="45" cy="45" r="3.5" fill="#E5B5C7"/>
    <circle cx="-65" cy="-65" r="2.5" fill="#C77B9B"/>
    <circle cx="0" cy="0" r="14" fill="#190B12" stroke="#701A3D" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#F8F0F3"/>
    <text x="0" y="82" fill="#701A3D" class="font-mono" font-size="8.5" letter-spacing="1.5" text-anchor="middle">ORBIT // 360° ENGINE</text>
  </g>

  <!-- Corner Tech Accent Marks -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#701A3D" stroke-width="1.2"/>
  <path d="M 868 24 L 868 12 L 856 12" fill="none" stroke="#701A3D" stroke-width="1.2"/>
  <path d="M 12 256 L 12 268 L 24 268" fill="none" stroke="#701A3D" stroke-width="1.2"/>
  <path d="M 868 256 L 868 268 L 856 268" fill="none" stroke="#701A3D" stroke-width="1.2"/>
</svg>