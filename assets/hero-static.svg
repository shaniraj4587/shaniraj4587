<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="cyber-stat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030014"/>
      <stop offset="45%" stop-color="#08021A"/>
      <stop offset="100%" stop-color="#02000A"/>
    </linearGradient>

    <!-- Neon Atmospheric Radial Glows -->
    <radialGradient id="neon-stat-cyan-glow" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#0066FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030014" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neon-stat-magenta-glow" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#7928CA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030014" stop-opacity="0"/>
    </radialGradient>

    <!-- Laser Underline Gradient -->
    <linearGradient id="laser-stat-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.1"/>
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FF007F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="circuit-stat-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#FF007F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030014" stop-opacity="0"/>
    </linearGradient>

    <!-- Cyber Matrix Grid Pattern -->
    <pattern id="cyber-stat-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00F0FF" stroke-width="0.7" stroke-opacity="0.12"/>
      <circle cx="32" cy="0" r="1" fill="#FF007F" fill-opacity="0.35"/>
    </pattern>

    <filter id="neon-stat-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambient-stat-text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Fira Code', monospace; }
    .font-display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif; }
  </style>

  <rect width="920" height="300" rx="18" fill="url(#cyber-stat-bg)"/>
  <rect width="920" height="300" rx="18" fill="url(#neon-stat-cyan-glow)"/>
  <rect width="920" height="300" rx="18" fill="url(#neon-stat-magenta-glow)"/>
  <rect width="920" height="300" rx="18" fill="url(#cyber-stat-grid)"/>

  <rect x="2" y="2" width="916" height="296" rx="16" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.5"/>
  <rect x="6" y="6" width="908" height="288" rx="13" fill="none" stroke="#FF007F" stroke-width="0.7" stroke-opacity="0.35"/>

  <!-- Brackets -->
  <path d="M 2 30 L 2 2 L 30 2" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#neon-stat-glow)"/>
  <path d="M 918 30 L 918 2 L 890 2" fill="none" stroke="#FF007F" stroke-width="3" filter="url(#neon-stat-glow)"/>
  <path d="M 2 270 L 2 298 L 30 298" fill="none" stroke="#FF007F" stroke-width="3" filter="url(#neon-stat-glow)"/>
  <path d="M 918 270 L 918 298 L 890 298" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#neon-stat-glow)"/>

  <!-- Top Status -->
  <g transform="translate(48, 40)">
    <circle cx="0" cy="0" r="4" fill="#00F0FF" filter="url(#neon-stat-glow)"/>
    <text x="18" y="4" fill="#00F0FF" class="font-mono" font-size="11" letter-spacing="2.2" font-weight="700">SYS.ONLINE // NEON PROTOCOL ACTIVATED</text>
  </g>

  <g transform="translate(868, 40)" text-anchor="end">
    <rect x="-180" y="-12" width="180" height="22" rx="4" fill="#050518" stroke="#FF007F" stroke-width="0.9" opacity="0.8"/>
    <text x="-12" y="3.5" fill="#FF007F" class="font-mono" font-size="9.5" letter-spacing="1.8" font-weight="600">HUD.ID: SHANI-RAJ</text>
  </g>

  <!-- Left Content -->
  <g transform="translate(48, 92)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="26" rx="6" fill="#0A0826" stroke="#00F0FF" stroke-width="1.2" opacity="0.95"/>
      <rect x="3" y="3" width="6" height="20" rx="2" fill="#00F0FF"/>
      <text x="20" y="17" fill="#00F0FF" class="font-mono" font-size="11" font-weight="700" letter-spacing="2">⚡ MASTER // NEXT.JS &amp; JAVASCRIPT</text>
    </g>

    <!-- Razor-Sharp Pure White Name with Ambient Cyan Halo -->
    <text x="0" y="74" fill="#00F0FF" class="font-display" font-size="50" font-weight="900" letter-spacing="3" filter="url(#ambient-stat-text-glow)" opacity="0.5">
      SHANI RAJ
    </text>
    <text x="0" y="74" fill="#FFFFFF" class="font-display" font-size="50" font-weight="900" letter-spacing="3">
      SHANI RAJ
    </text>

    <g transform="translate(0, 88)">
      <line x1="0" y1="0" x2="430" y2="0" stroke="url(#laser-stat-line-grad)" stroke-width="3" filter="url(#neon-stat-glow)"/>
      <circle cx="210" cy="0" r="3.5" fill="#FFFFFF"/>
    </g>

    <text x="0" y="122" fill="#F0F4FF" class="font-display" font-size="19" font-weight="700" letter-spacing="1">
      FULL STACK DEVELOPER
      <tspan fill="#FF007F"> //</tspan>
      <tspan fill="#00F0FF"> WEB ARCHITECT</tspan>
    </text>

    <g transform="translate(0, 150)">
      <text x="0" y="0" fill="#00F0FF" class="font-mono" font-size="11.5" letter-spacing="1.5">
        <tspan fill="#FF007F">CORE:</tspan> Next.js <tspan fill="#7928CA">•</tspan> JavaScript <tspan fill="#7928CA">•</tspan> React <tspan fill="#7928CA">•</tspan> TypeScript <tspan fill="#7928CA">•</tspan> Python <tspan fill="#7928CA">•</tspan> SQL
      </text>
    </g>
  </g>

  <!-- Circuit Stream -->
  <path d="M 430 240 C 490 200, 540 270, 610 230 C 680 190, 720 250, 780 210" 
        fill="none" stroke="url(#circuit-stat-grad)" stroke-width="2.2" stroke-dasharray="10,8" opacity="0.85"/>

  <!-- Gyro Core -->
  <g transform="translate(755, 155)">
    <line x1="-115" y1="0" x2="115" y2="0" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.4"/>
    <line x1="0" y1="-115" x2="0" y2="115" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.4"/>
    <circle cx="0" cy="0" r="102" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="6 26" opacity="0.6"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="24 12 6 12" opacity="0.85"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#FF007F" stroke-width="2" stroke-dasharray="16 10" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="46" ry="22" fill="none" stroke="#7928CA" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.85"/>
    <circle cx="58" cy="58" r="4.5" fill="#00F0FF"/>
    <circle cx="-45" cy="-45" r="3.5" fill="#FF007F"/>
    <circle cx="0" cy="0" r="16" fill="#050518" stroke="#00F0FF" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    <text x="0" y="98" fill="#00F0FF" class="font-mono" font-size="9" letter-spacing="2" text-anchor="middle" font-weight="700">QUANTUM // CORE 360°</text>
  </g>

  <g transform="translate(48, 276)">
    <text x="0" y="0" fill="#00F0FF" class="font-mono" font-size="9" letter-spacing="2" opacity="0.6">
      TELEMETRY: [30.22°N, 77.05°E] // STACK: NEXT.JS_MASTERY // STATUS: PRODUCTION_DEPLOYED
    </text>
  </g>
</svg>