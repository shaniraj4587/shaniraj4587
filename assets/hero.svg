<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030014"/>
      <stop offset="45%" stop-color="#08021A"/>
      <stop offset="100%" stop-color="#02000A"/>
    </linearGradient>

    <!-- Neon Atmospheric Radial Glows -->
    <radialGradient id="neon-cyan-glow" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#0066FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030014" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neon-magenta-glow" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#7928CA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030014" stop-opacity="0"/>
    </radialGradient>

    <!-- Laser Underline Gradient -->
    <linearGradient id="laser-line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.1"/>
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="70%" stop-color="#FF007F" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Circuit Path Gradient -->
    <linearGradient id="circuit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#FF007F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030014" stop-opacity="0"/>
    </linearGradient>

    <!-- Cyber Matrix Grid Pattern -->
    <pattern id="cyber-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00F0FF" stroke-width="0.7" stroke-opacity="0.12"/>
      <circle cx="32" cy="0" r="1" fill="#FF007F" fill-opacity="0.35"/>
    </pattern>

    <!-- Ambient Glow Filter for Background Elements -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="ambient-text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Fira Code', monospace; }
    .font-display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform { animation: none !important; }
    }
  </style>

  <!-- Deep Obsidian Background -->
  <rect width="920" height="300" rx="18" fill="url(#cyber-bg)"/>
  
  <!-- Neon Ambient Fields -->
  <rect width="920" height="300" rx="18" fill="url(#neon-cyan-glow)"/>
  <rect width="920" height="300" rx="18" fill="url(#neon-magenta-glow)"/>
  
  <!-- Cyber Matrix Overlay -->
  <rect width="920" height="300" rx="18" fill="url(#cyber-grid)"/>

  <!-- Futuristic Holographic Border -->
  <rect x="2" y="2" width="916" height="296" rx="16" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.5"/>
  <rect x="6" y="6" width="908" height="288" rx="13" fill="none" stroke="#FF007F" stroke-width="0.7" stroke-opacity="0.35"/>

  <!-- Cyberpunk Corner Brackets -->
  <path d="M 2 30 L 2 2 L 30 2" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#neon-glow)"/>
  <path d="M 918 30 L 918 2 L 890 2" fill="none" stroke="#FF007F" stroke-width="3" filter="url(#neon-glow)"/>
  <path d="M 2 270 L 2 298 L 30 298" fill="none" stroke="#FF007F" stroke-width="3" filter="url(#neon-glow)"/>
  <path d="M 918 270 L 918 298 L 890 298" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#neon-glow)"/>

  <!-- Corner Tech Hatch Marks -->
  <line x1="38" y1="12" x2="52" y2="12" stroke="#00F0FF" stroke-width="2" opacity="0.8"/>
  <line x1="868" y1="288" x2="882" y2="288" stroke="#FF007F" stroke-width="2" opacity="0.8"/>

  <!-- Top Cyber Status HUD -->
  <g transform="translate(48, 40)">
    <!-- Neon Pulsing Beacon -->
    <circle cx="0" cy="0" r="4" fill="#00F0FF" filter="url(#neon-glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="4;12;4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="4" fill="#00F0FF" class="font-mono" font-size="11" letter-spacing="2.2" font-weight="700">SYS.ONLINE // NEON PROTOCOL ACTIVATED</text>
  </g>

  <!-- Top Right Telemetry Badge -->
  <g transform="translate(868, 40)" text-anchor="end">
    <rect x="-180" y="-12" width="180" height="22" rx="4" fill="#050518" stroke="#FF007F" stroke-width="0.9" opacity="0.8"/>
    <text x="-12" y="3.5" fill="#FF007F" class="font-mono" font-size="9.5" letter-spacing="1.8" font-weight="600">HUD.ID: SHANI-RAJ</text>
  </g>

  <!-- Left Main Content Group -->
  <g transform="translate(48, 92)">
    <!-- Cyber Badge: Next.js & JavaScript Mastery -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="26" rx="6" fill="#0A0826" stroke="#00F0FF" stroke-width="1.2" opacity="0.95"/>
      <rect x="3" y="3" width="6" height="20" rx="2" fill="#00F0FF"/>
      <text x="20" y="17" fill="#00F0FF" class="font-mono" font-size="11" font-weight="700" letter-spacing="2">⚡ MASTER // NEXT.JS &amp; JAVASCRIPT</text>
    </g>

    <!-- Name / Title: Razor Sharp Crisp White with Soft Cyan Ambient Halo Behind -->
    <!-- Subtle Ambient Halo (Behind) -->
    <text x="0" y="74" fill="#00F0FF" class="font-display" font-size="50" font-weight="900" letter-spacing="3" filter="url(#ambient-text-glow)" opacity="0.5">
      SHANI RAJ
    </text>
    <!-- Sharp, Clear, 100% Readable Foreground Name -->
    <text x="0" y="74" fill="#FFFFFF" class="font-display" font-size="50" font-weight="900" letter-spacing="3">
      SHANI RAJ
    </text>

    <!-- Glowing Laser Underline with Moving High-Energy Spark -->
    <g transform="translate(0, 88)">
      <line x1="0" y1="0" x2="430" y2="0" stroke="url(#laser-line-grad)" stroke-width="3" filter="url(#neon-glow)"/>
      <circle cx="20" cy="0" r="3.5" fill="#FFFFFF" filter="url(#neon-glow)">
        <animate attributeName="cx" values="10;420;10" dur="3.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Primary Role Line -->
    <text x="0" y="122" fill="#F0F4FF" class="font-display" font-size="19" font-weight="700" letter-spacing="1">
      FULL STACK DEVELOPER
      <tspan fill="#FF007F"> //</tspan>
      <tspan fill="#00F0FF"> WEB ARCHITECT</tspan>
    </text>

    <!-- Futuristic Tech Spec -->
    <g transform="translate(0, 150)">
      <text x="0" y="0" fill="#00F0FF" class="font-mono" font-size="11.5" letter-spacing="1.5">
        <tspan fill="#FF007F">CORE:</tspan> Next.js <tspan fill="#7928CA">•</tspan> JavaScript <tspan fill="#7928CA">•</tspan> React <tspan fill="#7928CA">•</tspan> TypeScript <tspan fill="#7928CA">•</tspan> Python <tspan fill="#7928CA">•</tspan> SQL
      </text>
    </g>
  </g>

  <!-- Animated High-Speed Cyber Circuit Data Stream -->
  <path d="M 430 240 C 490 200, 540 270, 610 230 C 680 190, 720 250, 780 210" 
        fill="none" stroke="url(#circuit-grad)" stroke-width="2.2" stroke-dasharray="10,8" opacity="0.85">
    <animate attributeName="stroke-dashoffset" values="0;-144" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Right Side: Futuristic Quantum Core / Gyro HUD -->
  <g transform="translate(755, 155)">
    <!-- Target Reticle & Axis Lines -->
    <line x1="-115" y1="0" x2="115" y2="0" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.4"/>
    <line x1="0" y1="-115" x2="0" y2="115" stroke="#00F0FF" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.4"/>

    <!-- Outer Octagonal Bracket Shield -->
    <circle cx="0" cy="0" r="102" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-dasharray="6 26" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>

    <!-- Ring 1: Neon Cyan Clockwise High-Tech Ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="24 12 6 12" filter="url(#neon-glow)" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>

    <!-- Ring 2: Neon Magenta Counter-Clockwise Pulse Ring -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#FF007F" stroke-width="2" stroke-dasharray="16 10" filter="url(#neon-glow)" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- Ring 3: Elliptical Quantum Axis -->
    <ellipse cx="0" cy="0" rx="46" ry="22" fill="none" stroke="#7928CA" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Orbiting High-Energy Cyber Node 1 (on Cyan Ring) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <circle cx="82" cy="0" r="4.5" fill="#00F0FF" filter="url(#neon-glow)"/>
      <circle cx="82" cy="0" r="8" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Orbiting Plasma Node 2 (on Magenta Ring) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="240" to="600" dur="16s" repeatCount="indefinite"/>
      <circle cx="62" cy="0" r="3.5" fill="#FF007F" filter="url(#neon-glow)"/>
    </g>

    <!-- Central Glowing Quantum Reactor Core -->
    <circle cx="0" cy="0" r="16" fill="#050518" stroke="#00F0FF" stroke-width="2" filter="url(#neon-glow)"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" filter="url(#neon-glow)">
      <animate attributeName="r" values="6;9.5;6" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Quantum Telemetry Indicator -->
    <text x="0" y="98" fill="#00F0FF" class="font-mono" font-size="9" letter-spacing="2" text-anchor="middle" font-weight="700">QUANTUM // CORE 360°</text>
  </g>

  <!-- Bottom Technical Coordinate Strip -->
  <g transform="translate(48, 276)">
    <text x="0" y="0" fill="#00F0FF" class="font-mono" font-size="9" letter-spacing="2" opacity="0.6">
      TELEMETRY: [30.22°N, 77.05°E] // STACK: NEXT.JS_MASTERY // STATUS: PRODUCTION_DEPLOYED
    </text>
  </g>
</svg>