<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 44" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber-h-vibe-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A0624"/>
      <stop offset="60%" stop-color="#030014"/>
      <stop offset="100%" stop-color="#02000A"/>
    </linearGradient>
    <linearGradient id="cyber-h-vibe-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon-h-vibe-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Fira Code', monospace; }
    .font-display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
  <rect width="920" height="44" rx="8" fill="url(#cyber-h-vibe-bg)"/>
  <rect x="0.5" y="0.5" width="919" height="43" rx="7.5" fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="16" y1="43" x2="380" y2="43" stroke="url(#cyber-h-vibe-line)" stroke-width="2.5" filter="url(#neon-h-vibe-glow)"/>
  <path d="M 12 8 L 4 8 L 4 16" fill="none" stroke="#FF007F" stroke-width="1.8"/>
  <text x="24" y="27" fill="#00F0FF" class="font-mono" font-size="12" font-weight="800" letter-spacing="1.5">// 03</text>
  <text x="72" y="27" fill="#FFFFFF" class="font-display" font-size="14.5" font-weight="800" letter-spacing="1.5">VIBECODED // THE FLOW SUITE</text>
  <text x="900" y="26" fill="#FF007F" class="font-mono" font-size="10" letter-spacing="2" text-anchor="end" font-weight="700">APPS // NATIVE_ECOSYSTEM</text>
