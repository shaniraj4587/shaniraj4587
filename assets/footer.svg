<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 72" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cyber-foot-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030014"/>
      <stop offset="50%" stop-color="#0A0624"/>
      <stop offset="100%" stop-color="#030014"/>
    </linearGradient>

    <!-- Top Laser Shimmer -->
    <linearGradient id="cyber-foot-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1">
        <animate attributeName="stop-color" values="#FFFFFF;#00F0FF;#FF007F;#FFFFFF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#FF007F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="neon-foot-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Fira Code', monospace; }
    @media (prefers-reduced-motion: reduce) {
      animate { animation: none !important; }
    }
  </style>

  <!-- Container -->
  <rect width="920" height="72" rx="14" fill="url(#cyber-foot-bg)"/>
  <rect x="1" y="1" width="918" height="70" rx="13" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Top Accent Laser Line -->
  <line x1="20" y1="1" x2="900" y2="1" stroke="url(#cyber-foot-shimmer)" stroke-width="2" filter="url(#neon-foot-glow)"/>

  <!-- Left Status Indicator -->
  <g transform="translate(36, 36)">
    <circle cx="0" cy="0" r="4" fill="#00F0FF" filter="url(#neon-foot-glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#00F0FF" stroke-width="1">
      <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="16" y="4" fill="#00F0FF" class="font-mono" font-size="10.5" letter-spacing="2" font-weight="700">SYS: FULL_STACK // NEXT.JS &amp; JAVASCRIPT MASTER</text>
  </g>

  <!-- Center Reticle -->
  <g transform="translate(520, 36)">
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#FF007F" stroke-width="1.2" opacity="0.6"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" filter="url(#neon-foot-glow)"/>
  </g>

  <!-- Right Attribution -->
  <g transform="translate(884, 36)" text-anchor="end">
    <text x="0" y="4" fill="#FF007F" class="font-mono" font-size="10.5" letter-spacing="2" font-weight="700">
      SHANI RAJ <tspan fill="#00F0FF">•</tspan> FUTURE_READY
    </text>
  </g>
</svg>